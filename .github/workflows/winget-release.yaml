name: Winget release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # This fork does not submit its own releases to Winget: fork releases are
    # not part of the canonical `glzr-io.glazewm` Winget package, and this
    # job's token isn't configured for forks. Restrict to the upstream repo
    # so this workflow stays intact for future syncs from `glzr-io/glazewm`.
    if: github.repository == 'glzr-io/glazewm'
    steps:
      - uses: vedantmgoyal9/winget-releaser@19e706d4c9121098010096f9c495a70a7518b30f
        with:
          identifier: glzr-io.glazewm
          installers-regex: 'glazewm-v[0-9.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
